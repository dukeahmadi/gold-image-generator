[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-image-generator"
version = "0.1.0"
description = "Edit gold jewelry product photos with image models (white background, on-model placement); Telegram bot front end."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gold_imagegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
